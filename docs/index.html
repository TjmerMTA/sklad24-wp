<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Склад24 — демо на WordPress</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="wp" title="Склад24" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  // Real WordPress (PHP compiled to WebAssembly) runs in the visitor's browser via WordPress Playground.
  // The theme archive sits next to this page, so the demo works on any address it is published at.
  var here = new URL('.', location.href).href;
  var landing = new URLSearchParams(location.search).get('page') || '/';
  if (landing.charAt(0) !== '/') landing = '/';
  var blueprint = {
    landingPage: landing,
    preferredVersions: { php: '8.3', wp: 'latest' },
    features: { networking: true },
    login: true,
    siteOptions: { blogname: 'Склад24', blogdescription: 'Техніка для складу', timezone_string: 'Europe/Kyiv' },
    steps: [
      { step: 'setSiteLanguage', language: 'uk' },
      { step: 'installTheme', themeData: { resource: 'url', url: here + 'sklad24.zip?v=1' }, options: { activate: true } }
    ]
  };
  document.getElementById('wp').src =
    'https://playground.wordpress.net/?mode=seamless#' + encodeURI(JSON.stringify(blueprint));
})();
</script>
</body>
</html>
